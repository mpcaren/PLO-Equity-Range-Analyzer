[package]
name = "plo5-native"
version = "1.0.0"
description = "PLO5 Equity Lab — native desktop app (Slint) over the Rust PLO5 engine"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "plo5-equity-lab-native"
path = "src/main.rs"

[dependencies]
plo5 = { path = "../engine" }
slint = "=1.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rfd = "=0.16.1"
arboard = { version = "=3.7.0", default-features = false }
dirs = "=7.0.0"

[build-dependencies]
slint-build = "=1.18.1"
