[package]
name = "plo5-equity-lab"
version = "1.0.0"
description = "PLO5 Equity Lab — desktop equity calculator, range analyzer and trainers for 5-card PLO"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "plo5_equity_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
plo5 = { path = "../../engine" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
